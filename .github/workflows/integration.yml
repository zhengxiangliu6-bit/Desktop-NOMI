name: Frontend backend integration

on:
  push:
    branches: [main]
    paths:
      [
        "frontend/**",
        "backend/**",
        "contracts/**",
        ".github/workflows/integration.yml",
      ]
  pull_request:
    branches: [main]
    paths:
      [
        "frontend/**",
        "backend/**",
        "contracts/**",
        ".github/workflows/integration.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install backend test dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Check shared Pydantic contract
        working-directory: backend
        run: uv run --frozen pytest tests/test_contract_snapshot.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real local HTTP integration with test Mock Provider
        working-directory: frontend
        run: npm run test:integration
