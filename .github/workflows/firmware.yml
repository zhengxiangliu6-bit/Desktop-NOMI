name: H1 firmware checks

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified LVGL revision
        run: python3 firmware/scripts/prepare.py
      - name: Build model and actual LVGL renderer
        run: |
          cmake -S firmware/tests -B /tmp/nomi-tests -DNOMI_RENDER_TESTS=ON
          cmake --build /tmp/nomi-tests -j 4
          ctest --test-dir /tmp/nomi-tests --output-on-failure
  esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4@sha256:116f0526dfc87e764785370e59b88822e02cf4f9e1edd953cad5ed2d02672023
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-S3 firmware
        run: |
          . /opt/esp/idf/export.sh
          python scripts/prepare.py
          idf.py build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-nomi-h1-build
          path: |
            firmware/build/desktop_nomi_h1.bin
            firmware/build/desktop_nomi_h1.elf
            firmware/build/desktop_nomi_h1.map
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/build/flasher_args.json
            firmware/sdkconfig
            firmware/components/nomi_panel/LICENSE
            firmware/components/nomi_panel/NOTICE.md
            firmware/components/lvgl/LICENCE.txt
            firmware/components/lvgl/COPYRIGHTS.md
