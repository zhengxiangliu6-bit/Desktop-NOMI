name: H2 local audio firmware checks

on:
  push:
    branches: [main, feat/h2-local-wakeword, feat/h2-offline-voice-commands, feat/h2-usb-chinese-transcription, fix/h2-control-ack-session, feat/h2-spoken-okay, feat/h2-expression-gallery, feat/h2-natural-reply]
    paths: ["shared/**", "firmware/**", "tools/usb_asr/**", "docs/USB_CHINESE_TRANSCRIPTION.md", "docs/HARDWARE_H*.md", ".github/workflows/firmware.yml"]
  pull_request:
    branches: [main]
    paths: ["shared/**", "firmware/**", "tools/usb_asr/**", "docs/USB_CHINESE_TRANSCRIPTION.md", "docs/HARDWARE_H*.md", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified source and benchmark model
        run: python3 firmware/scripts/prepare.py
      - name: Check wake policy, PCM and real LVGL rendering
        run: |
          cmake -S firmware/tests -B /tmp/nomi-tests -DNOMI_RENDER_TESTS=ON
          cmake --build /tmp/nomi-tests -j 4
          ctest --test-dir /tmp/nomi-tests --output-on-failure
      - name: Check Python tools
        run: |
          python3 -m unittest discover -s firmware/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/usb_asr/tests -v
  esp32s3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [audio, benchmark, commands, usb_asr]
    container: espressif/idf:v5.5.4@sha256:116f0526dfc87e764785370e59b88822e02cf4f9e1edd953cad5ed2d02672023
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Compile and audit selected profile
        env:
          NOMI_BUILD_PROFILE: ${{ matrix.profile }}
        run: |
          . /opt/esp/idf/export.sh
          python scripts/build.py --profile "$NOMI_BUILD_PROFILE" --package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-nomi-h2-${{ matrix.profile }}
          if-no-files-found: error
          path: firmware/dist/desktop-nomi-h2-${{ matrix.profile }}.zip

  host_asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local Chinese ASR runtime
        run: python -m pip install -r tools/usb_asr/requirements.txt
      - name: Verify model hashes and decode public Chinese fixture (not hardware)
        run: |
          python tools/usb_asr/setup_model.py
          python tools/usb_asr/smoke_test.py --okay-asset firmware/components/nomi_audio/assets/okay.pcm
